<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bucks2Bars - Budget Tracker</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container mt-5">
        <div class="row mb-4">
            <div class="col-md-12">
                <h1 class="text-center mb-4">💰 Bucks2Bars TESTING1 - Budget Tracker</h1>
            </div>
        </div>

        <!-- Tabs Navigation -->
        <div class="row">
            <div class="col-md-12">
                <ul class="nav nav-tabs mb-4" id="budgetTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="data-tab" data-bs-toggle="tab" data-bs-target="#data-content" type="button" role="tab" aria-controls="data-content" aria-selected="true">
                            📊 Data
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="chart-tab" data-bs-toggle="tab" data-bs-target="#chart-content" type="button" role="tab" aria-controls="chart-content" aria-selected="false">
                            📈 Chart
                        </button>
                    </li>
                </ul>
            </div>
        </div>

        <!-- Tab Content -->
        <div class="tab-content" id="budgetTabContent">
            <!-- Data Tab -->
            <div class="tab-pane fade show active" id="data-content" role="tabpanel" aria-labelledby="data-tab">
                <div class="row">
                    <div class="col-md-12">
                        <h3 class="mb-4">Monthly Income & Expenses</h3>
                        <form id="budgetForm">
                            <div class="table-responsive">
                                <table class="table table-striped table-hover">
                                    <thead class="table-dark">
                                        <tr>
                                            <th>Month</th>
                                            <th>Income</th>
                                            <th>Expenses</th>
                                        </tr>
                                    </thead>
                                    <tbody id="monthsTable">
                                        <!-- Generated by JavaScript -->
                                    </tbody>
                                </table>
                            </div>
                            <div class="mt-3">
                                <button type="button" class="btn btn-primary" onclick="updateChart()">Update Chart</button>
                                <button type="reset" class="btn btn-secondary">Reset</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Chart Tab -->
            <div class="tab-pane fade" id="chart-content" role="tabpanel" aria-labelledby="chart-tab">
                <div class="row">
                    <div class="col-md-12">
                        <h3 class="mb-4">Income vs Expenses Overview</h3>
                        <div style="position: relative; height: 400px;">
                            <canvas id="budgetChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    
    <!-- Custom JavaScript -->
    <script src="app.js"></script>
</body>
</html>
